<main>
<div class="titulo"><img class="ico" src="https://wow.zamimg.com/images/wow/icons/large/inv_letter_15.jpg" alt=""><h1>Votación de los subs</h1></div><p class="lead" id="pregunta">Cargando…</p>
<div id="ops"></div><p class="mut">Un voto por persona; puedes cambiarlo cuando quieras.</p>
<p><a href="/">← Volver</a></p>
</main>
<footer class="pie"><b>Muchamiel · Zona de subs</b><br>Gracias por apoyar el canal · <a href="https://muchamielwow.github.io/">Web pública</a> · <a href="https://discord.gg/U8VkN5yXJ8" target="_blank" rel="noopener">Discord</a></footer>
<script src="/assets/zona.js"></script>
<script>
const pinta = d => {
  document.getElementById('pregunta').textContent = d.pregunta;
  const total = d.cuenta.reduce((a, b) => a + b, 0) || 1;
  const c = document.getElementById('ops'); c.innerHTML = '';
  d.opciones.forEach((o, i) => {
    const b = document.createElement('button');
    b.className = 'op' + (d.mio === i ? ' mia' : '');
    const pct = d.mio === null ? 0 : Math.round(d.cuenta[i] * 100 / total);
    b.innerHTML = `<div class="barra" style="width:${pct}%"></div><span>${d.mio === i ? '✔ ' : ''}${o.replace(/[<>&]/g, '')}${d.mio === null ? '' : ` · ${pct} % (${d.cuenta[i]})`}</span>`;
    b.onclick = async () => pinta({...d, ...(await fetch('/api/votar', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({opcion: i})}).then(r => r.json()))});
    c.append(b);
  });
};
fetch('/api/votar').then(r => r.json()).then(pinta);
</script></body></html>
