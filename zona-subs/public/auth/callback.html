<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><meta name="referrer" content="no-referrer"><title>Entrando… · Muchamiel</title>
<link rel="icon" href="/assets/sello.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Cinzel+Decorative:wght@700;900&display=swap"><link rel="stylesheet" href="/assets/estilo.css"></head>
<body><main class="puerta"><div class="portal"><img class="espera" src="/assets/sello.svg" alt=""><h1>Abriendo la colmena…</h1><p class="lead">Comprobando con Discord.</p><p class="mut" id="msg">Un segundo.</p></div></main>
<script>
(async () => {
  const h = new URLSearchParams(location.hash.slice(1));
  history.replaceState(null, '', location.pathname);  // el token no se queda en la barra de direcciones
  const token = h.get('access_token'), estado = h.get('state');
  if (!token || estado !== sessionStorage.getItem('mz_estado')) { location.replace('/entrar'); return; }
  sessionStorage.removeItem('mz_estado');
  const r = await fetch('/auth/session', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({token})});
  const d = await r.json().catch(() => ({}));
  if (d.ok) location.replace('/');
  else location.replace('/entrar?motivo=' + encodeURIComponent(d.motivo || 'discord') + (d.id ? '&id=' + encodeURIComponent(d.id) : ''));
})();
</script></body></html>
