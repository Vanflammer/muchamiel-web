<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><meta name="referrer" content="no-referrer"><title>Entrando… · Muchamiel</title><link rel="stylesheet" href="/assets/estilo.css"></head>
<body><main class="centro"><h1>Comprobando con Discord…</h1><p class="mut" id="msg">Un segundo.</p></main>
<script>
(async () => {
  const h = new URLSearchParams(location.hash.slice(1));
  history.replaceState(null, '', location.pathname);  // el token no se queda en la barra de direcciones
  const token = h.get('access_token'), estado = h.get('state');
  if (!token || estado !== sessionStorage.getItem('mz_estado')) { location.replace('/entrar'); return; }
  sessionStorage.removeItem('mz_estado');
  const r = await fetch('/auth/session', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({token})});
  const d = await r.json().catch(() => ({}));
  if (d.ok) location.replace('/');
  else location.replace('/entrar?motivo=' + encodeURIComponent(d.motivo || 'discord') + (d.id ? '&id=' + encodeURIComponent(d.id) : ''));
})();
</script></body></html>
